# Built-in preset: `use: postgres@18`. Your service's own keys replace these;
# env and exports merge key by key. A data volume only opens with the major
# version that wrote it, so the version is required and Portler never changes it.
# Postgres 17 and older keep their data in /var/lib/postgresql/data.
image: postgres:${version}-alpine
port: 5432
volumes:
  - '@${self.name}-data:/var/lib/postgresql'
versions:
  "18":
  "17":
    volumes:
      - '@${self.name}-data:/var/lib/postgresql/data'
  "16":
    volumes:
      - '@${self.name}-data:/var/lib/postgresql/data'
  "15":
    volumes:
      - '@${self.name}-data:/var/lib/postgresql/data'
  "14":
    volumes:
      - '@${self.name}-data:/var/lib/postgresql/data'
env:
  POSTGRES_USER: { default: postgres }
  POSTGRES_PASSWORD: { default: postgres, secret: true }
  POSTGRES_DB: { default: app }
healthcheck:
  # Over TCP: while the image creates the database on first start, its
  # temporary server only listens on the Unix socket.
  command: docker exec ${self.container} pg_isready -h 127.0.0.1 -p 5432
  timeout_ms: 120000
exports:
  database_url: postgres://${env.POSTGRES_USER}:${env.POSTGRES_PASSWORD}@${self.address}/${env.POSTGRES_DB}
