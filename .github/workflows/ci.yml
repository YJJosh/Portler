name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Portler is a Linux/macOS tool (its lifecycle is built on POSIX process
    # groups), so it is tested on both: the process-identity code reads
    # /proc on Linux and shells out to `ps` on macOS, and a regression in
    # either path would otherwise ship unnoticed.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test
        env:
          # Belt and braces: the tests set this themselves, but pinning it here
          # means a test that forgets to can never touch a real ~/.portler.
          PORTLER_GLOBAL_DIR: ${{ runner.temp }}/portler-global

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Check package contents
        run: npm pack --dry-run

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build
