name: prepare release

# Merge the package version bump through a PR first. This workflow only tags
# the verified main commit and creates a draft; it never writes to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged into main (for example 0.2.1, without the v)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch, not ${GITHUB_REF}."
            exit 1
          fi

          node <<'NODE'
          const current = require('./package.json').version;
          const lock = require('./package-lock.json');
          const target = process.env.RELEASE_VERSION;
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;

          if (!stable.test(target)) {
            console.error(`::error::${target} is not a stable semantic version such as 0.2.0`);
            process.exit(1);
          }

          if (target !== current) {
            console.error(`::error::release version ${target} does not match package.json version ${current}. Merge a version-bump PR before preparing the release.`);
            process.exit(1);
          }

          if (lock.version !== target || lock.packages?.['']?.version !== target) {
            console.error(`::error::package-lock.json does not match release version ${target}. Run npm version with --no-git-tag-version --ignore-scripts and merge both package files through a PR.`);
            process.exit(1);
          }
          NODE

          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::a GitHub Release for ${tag} already exists; review/publish its draft or delete it before retrying"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify release contents
        run: |
          npm run verify
          npm run docs:build
          npm pack --dry-run

      - name: Tag the verified main commit
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Verification must not change the tracked contents being released.
          git diff --exit-code
          git diff --cached --exit-code

          gh auth setup-git
          release_sha="$(git rev-parse HEAD)"
          tag="v${RELEASE_VERSION}"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null)" || existing_sha=""
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$release_sha" ]; then
              echo "::error::tag ${tag} already points to ${existing_sha}, not prepared commit ${release_sha}"
              exit 1
            fi
            echo "reusing ${tag} at ${release_sha} from an earlier partial run"
          else
            git tag "$tag" "$release_sha"
            # A tag created by another actor after this check makes the push
            # fail; release tags are never moved or force-pushed.
            git push origin "refs/tags/${tag}"
          fi
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.release_tag.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh release create "$tag" \
            --verify-tag \
            --title "Portler ${tag}" \
            --notes "<!-- release-sha:${RELEASE_SHA} -->" \
            --generate-notes \
            --draft

          url="$(gh release view "$tag" --json url --jq .url)"
          echo "Draft release: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the generated notes without removing the hidden release-sha comment, then publish the release to start npm publishing." >> "$GITHUB_STEP_SUMMARY"
